name: Early access to daily forecasts
description: Tell us you want access to Stockjection's daily forecasts when they open up.
title: "Early access: "
labels: ["early-access"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. Stockjection is a research project; nothing here is investment advice.
        Please do not post personal details (phone, PAN, account numbers) in this public form.
  - type: dropdown
    id: use
    attributes:
      label: What would you use it for?
      options:
        - Learning / research
        - Screening ideas for my own research
        - Comparing with my own model
        - Building an app or tool
        - Other
    validations:
      required: true
  - type: dropdown
    id: horizon
    attributes:
      label: Which horizon interests you most?
      options:
        - 1 day
        - 5 days (one week)
        - 20 days (one month)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything you would like to see? (optional)
